YAML = "ddb6d928-2868-570f-bddf-ab3f9cf99eb6"

# Never loaded by the supervisor, only by the children it launches. Declaring them weak keeps the
# supervisor light while their compat bounds below still keep an environment that holds all three
# packages (the Pkg workflow) on versions that agree with each other.
[weakdeps]
ReactantServer = "faa8a0e4-1926-4c6b-a0e2-e70699715ecf"
ReactantServerGateway = "b92f1031-7cb7-4fde-89de-b6dd50303018"

[compat]
ReactantServer = "0.1, 0.2"
ReactantServerCore = "1.2.0"
ReactantServerGateway = "0.1"
TOML = "1"
YAML = "0.4.16"
julia = "1.12"

[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test"]
