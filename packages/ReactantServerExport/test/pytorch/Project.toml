# PyTorch arm of the export round-trip. Same environment as ../Project.toml plus PythonCall and
# CondaPkg, which pull in the torch/jax/tensorflow Python environment declared in
# ../../CondaPkg.toml. Kept as a separate project so the Lux-only arm never has those deps in its
# manifest; see the comment in ../Project.toml for why presence alone is enough to provision.
#
# Runs the same test script, from one directory deeper:
#   julia --project=packages/ReactantServerExport/test/pytorch packages/ReactantServerExport/test/runtests.jl
[deps]
CondaPkg = "992eb4ea-22a4-4c89-a5bb-47a3300528ab"
HTTP = "cd3eb016-35fb-5094-929b-558a96fad6f3"
Lux = "b2108857-7c20-44ae-9111-449ecde12c47"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Reactant = "3c362404-f566-11ee-1572-e11a4b42c853"
ReactantServer = "faa8a0e4-1926-4c6b-a0e2-e70699715ecf"
ReactantServerCore = "387a5f05-f7b4-4d57-bca9-cd3358e52bdc"
ReactantServerExport = "90fa0446-f028-4638-8833-e223884d9b4d"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
YAML = "ddb6d928-2868-570f-bddf-ab3f9cf99eb6"
gRPCClient = "aaca4a50-36af-4a1d-b878-4c443f2061ad"
gRPCServer = "608c6337-0d7d-447f-bb69-0f5674ee3959"

[sources]
ReactantServer = {path = "../../../ReactantServer"}
ReactantServerCore = {path = "../../../ReactantServerCore"}
ReactantServerExport = {path = "../.."}
gRPCServer = {url = "https://github.com/csvance/gRPCServer.jl", rev = "s-celles-merge"}
