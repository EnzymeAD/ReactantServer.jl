# The integration suite: one environment holding every package a user installs, exercised the way
# the Julia tutorials tell users to run them. Each script under tutorials/ is both a test
# (runtests.jl runs it in a fresh process) and the source of a docs page (docs/make.jl renders it
# with Literate), so CI executes exactly what the tutorials show.
#
# The packages are path-sourced from this checkout, so the suite tests the tree it sits in. A user
# following a tutorial adds the same packages from the General registry instead. Keeping
# ReactantServer, ReactantServerGateway, and ReactantServerNode in one environment is the Pkg
# workflow the node supervisor supports: its children run in this environment too.
#
# PythonCall is deliberately absent (see packages/ReactantServerExport/test/Project.toml): its
# presence would make instantiate provision the whole torch/jax conda environment.
[deps]
Downloads = "f43a241f-c20a-4ad4-852c-f6b1247861c6"
Lux = "b2108857-7c20-44ae-9111-449ecde12c47"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
ReactantServer = "faa8a0e4-1926-4c6b-a0e2-e70699715ecf"
ReactantServerClient = "df172679-9d9b-4a02-a92c-27cb5f9e1c5c"
ReactantServerCore = "387a5f05-f7b4-4d57-bca9-cd3358e52bdc"
ReactantServerExport = "90fa0446-f028-4638-8833-e223884d9b4d"
ReactantServerGateway = "b92f1031-7cb7-4fde-89de-b6dd50303018"
ReactantServerNode = "49f09047-4fb9-4260-828b-8494ed8e9881"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[sources]
ReactantServer = {path = "../packages/ReactantServer"}
ReactantServerClient = {path = "../packages/ReactantServerClient"}
ReactantServerCore = {path = "../packages/ReactantServerCore"}
ReactantServerExport = {path = "../packages/ReactantServerExport"}
ReactantServerGateway = {path = "../packages/ReactantServerGateway"}
ReactantServerNode = {path = "../packages/ReactantServerNode"}

[compat]
Downloads = "1"
Lux = "1"
Random = "1"
Test = "1"
julia = "1.12"
