# The documentation environment, on the default Documenter HTML theme with the
# DocumenterLandingPage plugin (the VitePress-style landing page, rendered from
# the YAML frontmatter in index.md) and the DocumenterCodeBlocks plugin (line
# numbers, reference links, hover tooltips, JuliaSyntax highlighting). The
# monorepo's member packages are sourced from the repository tree rather than
# from the registry, so docs/make.jl documents the tree it sits in.
# Pkg.instantiate() from CI resolves each package's own dependencies (Reactant,
# gRPCServer, ...) into this environment's Manifest.
#
# DocumenterLandingPage is sourced from its git URL below (no registry
# entry yet); CI's Pkg.instantiate() resolves it like any other package.
# No Node is involved anywhere in the build anymore.
[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
DocumenterCodeBlocks = "b6400b83-267f-4b55-9fd8-bffc853bdfd8"
DocumenterLandingPage = "1c52b33b-3e2f-4e99-b3b5-a6ad63f0d6d2"
Reactant = "3c362404-f566-11ee-1572-e11a4b42c853"
ReactantServer = "faa8a0e4-1926-4c6b-a0e2-e70699715ecf"
ReactantServerClient = "df172679-9d9b-4a02-a92c-27cb5f9e1c5c"
ReactantServerCore = "387a5f05-f7b4-4d57-bca9-cd3358e52bdc"
ReactantServerExport = "90fa0446-f028-4638-8833-e223884d9b4d"
ReactantServerGateway = "b92f1031-7cb7-4fde-89de-b6dd50303018"
ReactantServerNode = "49f09047-4fb9-4260-828b-8494ed8e9881"
gRPCClient = "aaca4a50-36af-4a1d-b878-4c443f2061ad"
gRPCServer = "608c6337-0d7d-447f-bb69-0f5674ee3959"

[compat]
Documenter = "1.17"
DocumenterCodeBlocks = "1.3"
gRPCClient = "1.1.0"
ReactantServer = "0.1"
ReactantServerClient = "1"
ReactantServerCore = "1"
ReactantServerExport = "1"
ReactantServerGateway = "0.1"
ReactantServerNode = "0.1"

[sources]
ReactantServer = {path = "../packages/ReactantServer"}
ReactantServerClient = {path = "../packages/ReactantServerClient"}
ReactantServerCore = {path = "../packages/ReactantServerCore"}
ReactantServerGateway = {path = "../packages/ReactantServerGateway"}
ReactantServerNode = {path = "../packages/ReactantServerNode"}
ReactantServerExport = {path = "../packages/ReactantServerExport"}
gRPCServer = {url = "https://github.com/csvance/gRPCServer.jl", rev = "main"}
# The landing-page plugin, from its git URL so the docs CI can resolve it;
# a local build can override this with a path entry (see CONTRIBUTING.md).
DocumenterLandingPage = {url = "https://github.com/csvance/DocumenterLandingPage.jl"}
