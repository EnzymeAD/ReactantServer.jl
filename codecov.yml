# Codecov configuration.
#
# Informational, deliberately: coverage is a number to look at on a pull request, not a gate. The
# suites already decide pass or fail, and a status that fails on a fraction of a percent teaches
# people to merge past a red mark.
#
# Every suite CI runs uploads under its own flag. A package suite's flag is restricted to that
# package's sources; the cross-package suites (integration, the export round-trips, the worked
# examples) run the packages together, so their flags span every package they can reach. The
# suites are path-filtered, so most runs skip most of them; carryforward keeps a skipped suite's
# last report instead of dropping it from the total.
#
# Generated protobuf bindings (*_pb.jl, ProtoBuf.jl output) are ignored everywhere: they are
# regenerated rather than edited, and most of each file is message types and codecs for RPCs a
# given package never serves, which would otherwise read as untested code.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flag_management:
  default_rules:
    carryforward: true

flags:
  core:
    paths: [packages/ReactantServerCore/src/]
  client:
    paths: [packages/ReactantServerClient/src/]
  gateway:
    paths: [packages/ReactantServerGateway/src/]
  server:
    paths: [packages/ReactantServer/src/, packages/ReactantServer/ext/]
  node:
    paths: [packages/ReactantServerNode/src/]
  export-lux:
    paths: [packages/]
  export-pytorch:
    paths: [packages/]
  integration:
    paths: [packages/]
  examples:
    paths: [packages/]

ignore:
  - "**/*_pb.jl"
  - "**/test/**"
  - "docs/**"
  - "examples/**"
  - "tools/**"
  - "lib/**"
