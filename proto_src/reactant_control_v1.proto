// ReactantServer control plane (v1). Distinct from the KServe V2 GRPCInferenceService data plane,
// this package carries TWO services with different terminators:
//
//   ControlService        answered by each WORKER: model residency and live scheduler policy.
//                         Modeled on NVIDIA Triton's model-control extension with our pinning
//                         semantics. Residency RPCs are authoritative only on an externally-managed
//                         worker; a self-managed worker rejects them. SetModelPolicy works in both
//                         modes. The gateway also terminates CompactMemory and fans it out.
//   GatewayControlService answered by the GATEWAY process itself: its live lpt_packing scheduling
//                         state (placement, knobs, repacks). Workers do not implement it.

syntax = "proto3";
package reactant_control;

service ControlService
{
  // List every model with its residency state, host/device residency, footprint, scheduler
  // weight, and queue depth, plus the worker's residency mode and scheduling discipline.
  rpc ModelControlStatus(ModelControlStatusRequest) returns (ModelControlStatusResponse) {}

  // Move a model to a target residency floor (externally-managed workers only).
  rpc SetModelResidency(SetModelResidencyRequest) returns (SetModelResidencyResponse) {}

  // Update a model's live scheduler policy (currently its fair-discipline weight).
  rpc SetModelPolicy(SetModelPolicyRequest) returns (SetModelPolicyResponse) {}

  // Free all resident device weights so the allocator coalesces its free list, then reload the
  // pinned models (always) plus any named in reload_models. Used to defragment the device arena.
  rpc CompactMemory(CompactMemoryRequest) returns (CompactMemoryResponse) {}
}

// Residency floor for a model's weights. UNSPECIFIED is never returned; it is the proto3 zero
// value and is rejected as a SetModelResidency target.
enum Residency
{
  RESIDENCY_UNSPECIFIED = 0;
  UNPINNED = 1;
  PINNED_SYSTEM = 2;
  PINNED_DEVICE = 3;
}

message ModelControlStatusRequest {}

message ModelStatus
{
  string name = 1;
  Residency residency = 2;
  bool device_resident = 3;
  bool host_resident = 4;
  int64 weight_nbytes = 5;
  double weight = 6;
  int64 queue_depth = 7;
  // Cumulative serving counters, for a gateway/control plane to derive true per-request compute
  // cost (delta total_compute_seconds / delta requests_served between polls) and dispatch rates.
  // requests_served counts individual requests; dispatch_count counts coalesced batch executions.
  double total_compute_seconds = 8;
  uint64 requests_served = 9;
  uint64 dispatch_count = 10;
  // The effective maximum batch size the worker coalesces this model to: the largest compiled
  // batch shape, further limited by the configured scheduler.models.<name>.max_batch_size cap.
  // 0 when unknown. Routing metadata a gateway uses to fill one replica's batch before the next.
  int64 max_batch_size = 11;
}

message ModelControlStatusResponse
{
  // "self_managed" or "externally_managed".
  string residency_mode = 1;
  // "fair" or "fifo".
  string discipline = 2;
  repeated ModelStatus models = 3;
  // Byte budget for on-demand (unpinned) weights on this worker, the memory capacity a
  // gateway packs model weight footprints against. 0 when the on-demand cache is disabled
  // (every model stays device-resident), meaning memory is not a packing constraint.
  uint64 weight_cache_max_bytes = 4;
}

message SetModelResidencyRequest
{
  string name = 1;
  Residency target = 2;
}

message SetModelResidencyResponse
{
  // The resulting residency state.
  Residency residency = 1;
}

message SetModelPolicyRequest
{
  string name = 1;
  // proto3 has no scalar presence; set has_weight to apply `weight`.
  bool has_weight = 2;
  double weight = 3;
}

message SetModelPolicyResponse {}

message CompactMemoryRequest
{
  // Non-pinned models to reload eagerly after freeing (pinned models are always reloaded). Empty
  // reloads the pinned set only; the rest reload lazily as requests arrive (self-managed mode).
  repeated string reload_models = 1;
}

message CompactMemoryResponse
{
  int64 reloaded_models = 1;
  uint64 resident_bytes_after = 2;
}

// ------------------------------------------------------------------------------------------------
// The gateway's own control service. Every RPC here is answered by the gateway process, not by a
// worker, and drives its live lpt_packing scheduling state. Nothing is persisted: a gateway restart
// reverts every value to gateway.yml plus the environment.
service GatewayControlService
{
  // Read the live scheduling state: the mode, every runtime knob, repack bookkeeping, and one row
  // per model and per worker. Succeeds in every scheduling mode; `policy` and `repack` are unset for
  // the modes that have no knobs.
  rpc GetSchedulingStatus(GetSchedulingStatusRequest) returns (GetSchedulingStatusResponse) {}

  // Update the global scheduling knobs. `update_mask` names the fields of `policy` to apply;
  // everything else keeps its current value. All or nothing: one invalid value rejects the whole
  // request and no knob changes. lpt_packing only.
  rpc SetSchedulingPolicy(SetSchedulingPolicyRequest) returns (SetSchedulingPolicyResponse) {}

  // Set, change, or clear one model's overrides (replica count and how its requests use its GPUs).
  // Takes effect at the next repack. lpt_packing only.
  rpc SetModelPlacement(SetModelPlacementRequest) returns (SetModelPlacementResponse) {}

  // Repack now, bypassing the accumulated-compute budget, optionally waiting a bounded time for it
  // to land. lpt_packing only.
  rpc Repack(RepackRequest) returns (RepackResponse) {}
}

// The gateway's runtime-mutable scheduling knobs. Used both as the read-out in
// GetSchedulingStatusResponse and as the value carrier in SetSchedulingPolicyRequest; the field
// names here are exactly the names accepted in SetSchedulingPolicyRequest.update_mask.
message SchedulingPolicy
{
  double rebalance_compute_seconds = 1;
  double first_rebalance_compute_seconds = 2;    // 0 = no separate first-repack budget
  double hysteresis = 3;
  // The halflife actually in force, already resolved: a configured 0 means "track
  // rebalance_compute_seconds" and is resolved once at startup, so this never reads 0 and never
  // moves retroactively when rebalance_compute_seconds is changed later.
  double ema_halflife_compute_seconds = 4;
  // Replica counts: > 0 a fixed number of distinct GPUs, -1 every ready worker ("all" in the yaml).
  int64 default_replicas = 5;
  string routing_policy = 6;                     // "fill_rr" | "fill_least"
  double routing_fill_factor = 7;
  // "run" | "spread" | "inflight". WARNING on "inflight": it counts requests IN FLIGHT, so a model
  // whose in-flight concurrency stays between 2 and its quantum and never drains to zero is served
  // by ONE replica indefinitely while the others receive no traffic. Diagnose with
  // gateway_replica_routed_total. Prefer "run", or "spread" when a model needs every GPU at once.
  string routing_fill_mode = 8;
  string compaction_mode = 9;                    // "off" | "eager" | "scheduled"
  int64 compaction_interval = 10;                // repacks between compactions; 0 disables
  bool forbid_memory_oversubscription = 11;
  // 0 while every knob still matches gateway.yml; bumped by each accepted mutation, so an operator
  // inheriting a running gateway can tell a tuned one from a fresh one.
  uint64 generation = 12;
}

message GetSchedulingStatusRequest {}

message RepackStatus
{
  double last_repack_unix_seconds = 1;           // 0 = no repack yet
  double last_repack_wall_elapsed_seconds = 2;   // wall time the last repack covered
  double last_repack_compute_seconds = 3;        // fleet GPU-seconds the last repack consumed
  string last_trigger = 4;                       // "startup" | "compute" | "operator"
  int64 last_models_placed = 5;
  int64 last_models_moved = 6;
  uint64 repack_count = 7;                       // repacks since start, including the startup one
  // Live compute-trigger accounting, as of the last prober tick.
  double compute_accumulated_seconds = 8;
  double active_threshold_seconds = 9;           // the budget the next tick compares against
  bool first_tick_repack_done = 10;              // false = the first-repack budget is still armed
  double last_tick_unix_seconds = 11;
  int64 repacks_since_compaction = 12;
  // Operator-forced repack handshake counters (see Repack).
  uint64 operator_repacks_requested = 13;
  uint64 operator_repacks_completed = 14;
}

message ReplicaPlacement
{
  string worker = 1;
  double weight = 2;        // 1/k across the model's k replicas
  // In-flight ITEMS right now: the summed batch size of the requests in flight, matching the fill
  // quantum's denomination. Equals a request count when every request carries a single item.
  int64 outstanding = 3;
  int64 routed_total = 4;   // cumulative REQUESTS routed to it (flat on a starved replica)
}

message ModelSchedulingStatus
{
  string name = 1;
  int64 configured_replicas = 2;   // > 0 a count, -1 all, 0 no override (uses default_replicas)
  int64 effective_replicas = 3;    // the placement actually installed, after clamping
  repeated ReplicaPlacement replicas = 4;
  double utilization = 5;          // u_m = rate * cost, GPU-sec/wall-sec, as of the last repack
  double arrival_rate = 6;         // requests/sec EWMA, as of the last repack
  double cost_seconds = 7;         // measured per-request compute, GPU-seconds
  int64 max_batch = 8;             // worker-reported effective max batch (refreshed every tick)
  string fill_mode = 9;            // resolved: the override, else the fleet default
  int64 fill_quantum = 10;         // resolved run length in ITEMS (a batch of 32 spends 32)
  int64 weight_nbytes = 11;        // footprint seen at the last repack
  bool placed = 12;                // false = no placement yet (cold; routed round robin)
  bool drifted = 13;               // not reported by every ready worker at the last repack
}

message WorkerSchedulingStatus
{
  string worker = 1;
  bool ready = 2;                  // answered the control poll at the last repack
  int64 models_placed = 3;
  double inflight_compute = 4;     // in-flight requests weighted by measured per-request cost
  int64 assigned_weight_bytes = 5;
  int64 weight_budget_bytes = 6;   // 0 = unconstrained
  bool oversubscribed = 7;         // assigned > budget
}

message GetSchedulingStatusResponse
{
  string mode = 1;                             // "round_robin" | "least_outstanding" | "lpt_packing"
  SchedulingPolicy policy = 2;                 // unset outside lpt_packing
  RepackStatus repack = 3;                     // unset outside lpt_packing
  repeated ModelSchedulingStatus models = 4;
  repeated WorkerSchedulingStatus workers = 5;
  repeated string warnings = 6;
}

message SetSchedulingPolicyRequest
{
  // Names of the SchedulingPolicy fields to apply. Must be non-empty; an unrecognized name, or the
  // name of a startup-only setting, is rejected rather than ignored.
  repeated string update_mask = 1;
  SchedulingPolicy policy = 2;
}

message SetSchedulingPolicyResponse
{
  SchedulingPolicy applied = 1;    // the complete knob set now in force
  repeated string warnings = 2;
  bool persisted = 3;              // always false: in-memory only, reverted by a gateway restart
}

message SetModelPlacementRequest
{
  string name = 1;
  // > 0 a fixed number of distinct GPUs, -1 every ready worker, 0 removes the override so the model
  // falls back to default_replicas, and < -1 is rejected. Leave unset (0) to change only the fill
  // fields below... note that 0 therefore CLEARS the replica override; to change nothing but the fill
  // mode, send the model's current configured_replicas back.
  int64 replicas = 2;
  // "" leaves the model's fill mode unchanged, "inherit" clears it back to the scheduling default,
  // and "run" / "spread" / "inflight" set it.
  string fill_mode = 3;
  // < 0 leaves the run length unchanged, 0 clears it back to the scheduling default, > 0 sets it.
  double fill_factor = 4;
  // By default a model no worker currently serves is rejected NOT_FOUND, which catches typos. Set
  // this to pre-seed an override for a model that is about to be loaded.
  bool allow_unknown_model = 5;
}

message SetModelPlacementResponse
{
  string name = 1;
  int64 configured_replicas = 2;   // the override now in force (0 = none, -1 = all)
  int64 effective_replicas = 3;    // after clamping to the ready-worker count, at the next repack
  string fill_mode = 4;            // resolved mode that will apply
  int64 fill_quantum = 5;
  repeated string warnings = 6;
  bool persisted = 7;              // always false
}

message RepackRequest
{
  // Bounded wait for the repack to land, in seconds. 0 returns as soon as the request is queued.
  // Clamped to a server maximum; the caller's own gRPC deadline still wins.
  double wait_seconds = 1;
}

message RepackResponse
{
  uint64 sequence = 1;             // the operator-repack sequence this request was assigned
  uint64 completed_sequence = 2;   // the highest operator repack the gateway has served
  bool completed = 3;              // false = queued, not observed within wait_seconds
  double waited_seconds = 4;
  RepackStatus repack = 5;         // bookkeeping after the wait
  repeated string warnings = 6;
}
