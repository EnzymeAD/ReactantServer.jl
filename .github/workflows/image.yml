# Build the locked CUDA node image with Bazel (//deploy:image), push it to the GitHub Container
# Registry as ghcr.io/<owner>/reactantserver, and attest its build provenance.
#
# Releases: TagBot pushes ReactantServer-vX.Y.Z on the commit the General registry records, and that
# push runs this workflow. The image is published as :X.Y.Z, :X.Y and :latest. ReactantServer is
# released last in each round, so its version names the whole image (worker, gateway and node, all
# built from the tagged tree and its deploy/Manifest.toml). :X.Y and :latest move only when this is
# the highest release in that line, so a patch to an older line never moves them backwards.
# TagBot pushes tags with an SSH deploy key; a tag pushed with GITHUB_TOKEN would not start this run.
#
# By hand (Actions > Image > Run workflow, or `gh workflow run image.yml --ref <branch>`): the image
# is published as :sha-<commit> only, so :latest always means the newest release. Run on a
# ReactantServer-vX.Y.Z tag ref, it publishes that release as if TagBot had pushed it.
#
# No secrets: the run's own GITHUB_TOKEN pushes the image, and its OIDC identity signs the
# attestation through Sigstore. The owner is the repository's (lowercased, as registry paths must
# be), so a fork publishes to its own namespace. The first push creates the package; an owner of the
# organization then makes it public once, in the package's settings, so it can be pulled
# anonymously.
#
# The attestation is SLSA build provenance binding the pushed digest to this repository, commit,
# workflow and run. It is stored with GitHub and next to the image in the registry. Verify with:
#   gh attestation verify oci://ghcr.io/enzymead/reactantserver:0.1.0 --repo EnzymeAD/ReactantServer.jl
name: Image

on:
  push:
    tags:
      - "ReactantServer-v*"
  workflow_dispatch:

# Two runs moving the same tags at once would race; the later one waits instead.
concurrency:
  group: image-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write           # push the image to ghcr.io
      id-token: write           # the OIDC token Sigstore issues the signing certificate for
      attestations: write       # store the attestation with GitHub
      artifact-metadata: write  # record where the attested image is stored
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # The CUDA base, the depot (Reactant's CUDA artifact included) and the layers built from them
      # need tens of gigabytes. The runner's root disk is too small for that once its preinstalled
      # toolchains are counted, so those are removed and Bazel keeps everything on /mnt.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo mkdir -p /mnt/bazel
          sudo chown "$(id -u):$(id -g)" /mnt/bazel
          printf '%s\n' \
            'startup --output_user_root=/mnt/bazel/root' \
            'common --repository_cache=/mnt/bazel/repository-cache' \
            > user.bazelrc
          df -h / /mnt

      # Bazelisk is preinstalled as `bazel` and runs the version in .bazelversion.
      - name: Check the Julia lock
        run: bazel test //deploy:manifest_current

      # Builds every layer, then loads every entry project from them with nothing precompiled and
      # no cache rejected. A failure here stops the run before anything is pushed.
      - name: Build the image and check it starts warm
        run: bazel test //deploy:image_precompile_test

      # Writes the credential to ~/.docker/config.json, which crane (run by oci_push) reads to push
      # the image and the attest step uses to push the attestation beside it.
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A ReactantServer-vX.Y.Z ref is a release: :X.Y.Z always, and :X.Y and :latest only when no
      # higher release exists in that line. Anything else is a build of a commit, :sha-<commit>.
      - name: Choose the tags
        id: tags
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^ReactantServer-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            released="$(git ls-remote --tags --refs origin 'refs/tags/ReactantServer-v*' |
              sed -nE 's|.*refs/tags/ReactantServer-v([0-9]+\.[0-9]+\.[0-9]+)$|\1|p' | sort -V)"
            tags=("$version")
            [[ "$(grep -E "^${line//./\\.}\\." <<<"$released" | tail -n1)" == "$version" ]] && tags+=("$line")
            [[ "$(tail -n1 <<<"$released")" == "$version" ]] && tags+=(latest)
          else
            tags=("sha-${GITHUB_SHA::12}")
          fi
          echo "list=${tags[*]}" >> "$GITHUB_OUTPUT"

      # The digest comes from the OCI layout that was pushed, so it is what a pull by digest
      # returns and what the attestation is bound to.
      - name: Push
        id: push
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reactantserver"
          args=()
          for t in ${{ steps.tags.outputs.list }}; do args+=(--tag "$t"); done
          bazel run //deploy:image_push -- --repository "$repository" "${args[@]}"
          digest="$(jq -r '.manifests[0].digest' bazel-bin/deploy/image/index.json)"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Pushed \`$repository\` as: ${{ steps.tags.outputs.list }}"
            echo
            echo "Digest: \`$digest\` (commit \`$GITHUB_SHA\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      # SLSA build provenance for the pushed digest (no predicate given, so provenance is the
      # default), signed with this run's identity and pushed beside the image.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
