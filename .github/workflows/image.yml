# Build the locked CUDA node image with Bazel (//deploy:image), push it to the GitHub Container
# Registry as ghcr.io/<owner>/reactantserver, and attest its build provenance.
#
# Releases: TagBot pushes ReactantServer-vX.Y.Z on the commit the General registry records, and that
# push runs this workflow. The image is published as :X.Y.Z, :X.Y and :latest. ReactantServer is
# released last in each round, so its version names the whole image (worker, gateway and node, all
# built from the tagged tree and its deploy/Manifest.toml). :X.Y and :latest move only when this is
# the highest release in that line, so a patch to an older line never moves them backwards.
# TagBot pushes tags with an SSH deploy key; a tag pushed with GITHUB_TOKEN would not start this run.
#
# By hand (Actions > Image > Run workflow, or `gh workflow run image.yml --ref <branch>`): the image
# is published as :sha-<commit> only, so :latest always means the newest release. Run on a
# ReactantServer-vX.Y.Z tag ref, it publishes that release as if TagBot had pushed it.
#
# No secrets: the run's own GITHUB_TOKEN pushes the image, and its OIDC identity signs the
# attestation through Sigstore. The owner is the repository's (lowercased, as registry paths must
# be), so a fork publishes to its own namespace. The first push creates the package; an owner of the
# organization then makes it public once, in the package's settings, so it can be pulled
# anonymously.
#
# A release then builds its versioned docs (docs.yml, on the tag ref) and commits its completed
# container release record (docs/releases/X.Y.Z.toml) to main. The commit is pushed with the
# RELEASE_RECORD_KEY deploy key, which main's branch rules exempt so the commit needs no pull
# request; a push with GITHUB_TOKEN would also not run the workflows that rebuild the dev docs.
#
# The attestation is SLSA build provenance binding the pushed digest to this repository, commit,
# workflow and run. It is stored with GitHub and next to the image in the registry. Verify with:
#   gh attestation verify oci://ghcr.io/enzymead/reactantserver:0.1.0 --repo EnzymeAD/ReactantServer.jl
name: Image

on:
  push:
    tags:
      - "ReactantServer-v*"
  workflow_dispatch:

# Two runs moving the same tags at once would race; the later one waits instead.
concurrency:
  group: image-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write           # push the image to ghcr.io
      id-token: write           # the OIDC token Sigstore issues the signing certificate for
      attestations: write       # store the attestation with GitHub
      artifact-metadata: write  # record where the attested image is stored
    outputs:
      version: ${{ steps.tags.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true             # deploy/debs/*.deb, the Ubuntu packages the image adds

      # The CUDA base, the depot (Reactant's CUDA artifact included) and the layers built from them
      # need tens of gigabytes. The runner's root disk is too small for that once its preinstalled
      # toolchains are counted, so those are removed and Bazel keeps everything on /mnt. That
      # includes the depot @reactantserver_depot instantiates into at fetch, which declares no
      # `dir` and so would otherwise fill ~/.julia on the root disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo mkdir -p /mnt/bazel
          sudo chown "$(id -u):$(id -g)" /mnt/bazel
          printf '%s\n' \
            'startup --output_user_root=/mnt/bazel/root' \
            'common --repository_cache=/mnt/bazel/repository-cache' \
            'common --repo_env=JULIA_DEPOT_PATH=/mnt/bazel/julia-depot' \
            > user.bazelrc
          df -h / /mnt

      # Bazelisk is preinstalled as `bazel` and runs the version in .bazelversion.
      - name: Check the Julia lock
        run: bazel test //deploy:manifest_current

      # Builds every layer, then loads every entry project from them with nothing precompiled and
      # no cache rejected. A failure here stops the run before anything is pushed.
      - name: Build the image and check it starts warm
        run: bazel test //deploy:image_precompile_test

      # Writes the credential to ~/.docker/config.json, which crane (run by oci_push) reads to push
      # the image and the attest step uses to push the attestation beside it.
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A ReactantServer-vX.Y.Z ref is a release: :X.Y.Z always, and :X.Y and :latest only when no
      # higher release exists in that line. Anything else is a build of a commit, :sha-<commit>.
      - name: Choose the tags
        id: tags
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^ReactantServer-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            released="$(git ls-remote --tags --refs origin 'refs/tags/ReactantServer-v*' |
              sed -nE 's|.*refs/tags/ReactantServer-v([0-9]+\.[0-9]+\.[0-9]+)$|\1|p' | sort -V)"
            tags=("$version")
            [[ "$(grep -E "^${line//./\\.}\\." <<<"$released" | tail -n1)" == "$version" ]] && tags+=("$line")
            [[ "$(tail -n1 <<<"$released")" == "$version" ]] && tags+=(latest)
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            tags=("sha-${GITHUB_SHA::12}")
          fi
          echo "list=${tags[*]}" >> "$GITHUB_OUTPUT"

      # The digest comes from the OCI layout that was pushed, so it is what a pull by digest
      # returns and what the attestation is bound to. --stamp records the commit in the image's
      # org.opencontainers.image.revision label (deploy/workspace_status.sh); it changes only the
      # image config, so every layer the test step built is reused.
      - name: Push
        id: push
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reactantserver"
          args=()
          for t in ${{ steps.tags.outputs.list }}; do args+=(--tag "$t"); done
          bazel build --stamp //deploy:image_labels
          labels="$(cat bazel-bin/deploy/image_labels.txt)"
          grep -qx "org.opencontainers.image.revision=$GITHUB_SHA" <<<"$labels" ||
            { echo "::error::the image would not record revision $GITHUB_SHA:"; echo "$labels"; exit 1; }
          bazel run --stamp //deploy:image_push -- --repository "$repository" "${args[@]}"
          digest="$(jq -r '.manifests[0].digest' bazel-bin/deploy/image/index.json)"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Pushed \`$repository\` as: ${{ steps.tags.outputs.list }}"
            echo
            echo "Digest: \`$digest\` (commit \`$GITHUB_SHA\`)"
            echo
            echo "Labels: $(paste -sd' ' bazel-bin/deploy/image_labels.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      # SLSA build provenance for the pushed digest (no predicate given, so provenance is the
      # default), signed with this run's identity and pushed beside the image.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  docs:
    needs: image
    if: needs.image.outputs.version != ''
    permissions:
      contents: write           # deploy to gh-pages
    uses: ./.github/workflows/docs.yml
    with:
      image-digest: ${{ needs.image.outputs.digest }}

  # The same `record` the docs build ran, committed to main so the dev docs and every later release's
  # docs carry it. Rerunning it rewrites the same file, and a run with nothing new commits nothing.
  # Only this file changes, so a push that loses a race to another merge rebases cleanly.
  record:
    needs: image
    if: needs.image.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.image.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_RECORD_KEY }}
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.12'
      - name: Commit the release record to main
        run: |
          git fetch --depth=1 origin tag "ReactantServer-v$VERSION"
          julia --startup-file=no docs/releases.jl record "$VERSION" --digest "$DIGEST"
          git add "docs/releases/$VERSION.toml"
          git diff --cached --quiet && { echo "docs/releases/$VERSION.toml is already current"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record container release $VERSION" -m "Written by the Image workflow once ghcr.io/enzymead/reactantserver:$VERSION was pushed ($DIGEST): the commit, image digest and publication date a draft cannot carry."
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main && git rebase origin/main
          done
          exit 1
