# Build the locked CUDA node image with Bazel (//deploy:image) and push it to Docker Hub as :latest.
# Triggered by hand only: Actions > Image > Run workflow, or `gh workflow run image.yml --ref <branch>`.
#
# Releases are not named yet, so every run overwrites :latest. The image digest is printed in the
# run summary; pull by that digest to pin a deployment.
#
# Needs, in the repository settings:
#   variable DOCKERHUB_REPOSITORY  the target, e.g. index.docker.io/<org>/<name>
#   secret   DOCKERHUB_USERNAME
#   secret   DOCKERHUB_TOKEN       a Docker Hub access token with write access to that repository
name: Image

on:
  workflow_dispatch:

# Two runs pushing :latest at once would race; the later one waits instead.
concurrency:
  group: image-latest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # The CUDA base, the depot (Reactant's CUDA artifact included) and the layers built from them
      # need tens of gigabytes. The runner's root disk is too small for that once its preinstalled
      # toolchains are counted, so those are removed and Bazel keeps everything on /mnt.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo mkdir -p /mnt/bazel
          sudo chown "$(id -u):$(id -g)" /mnt/bazel
          printf '%s\n' \
            'startup --output_user_root=/mnt/bazel/root' \
            'common --repository_cache=/mnt/bazel/repository-cache' \
            > user.bazelrc
          df -h / /mnt

      # Bazelisk is preinstalled as `bazel` and runs the version in .bazelversion.
      - name: Check the Julia lock
        run: bazel test //deploy:manifest_current

      # Builds every layer, then loads every entry project from them with nothing precompiled and
      # no cache rejected. A failure here stops the run before anything is pushed.
      - name: Build the image and check it starts warm
        run: bazel test //deploy:image_precompile_test

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push :latest
        env:
          REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          : "${REPOSITORY:?set the DOCKERHUB_REPOSITORY repository variable}"
          bazel run //deploy:image_push -- --repository "$REPOSITORY"
          digest="$(jq -r '.manifests[0].digest' bazel-bin/deploy/image/index.json)"
          {
            echo "Pushed \`$REPOSITORY:latest\`"
            echo
            echo "Digest: \`$digest\` (commit \`$GITHUB_SHA\`)"
          } >> "$GITHUB_STEP_SUMMARY"
