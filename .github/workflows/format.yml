# Runic formatting check: every .jl file in the repo must be Runic-formatted. Run
# `runic --inplace .` locally (see CONTRIBUTING.md) and commit the result; this check
# fails with a diff until the whole tree is formatted.
name: Format

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

# actions: write is needed because julia-actions/cache prunes its own old caches.
permissions:
  contents: read
  actions: write

jobs:
  runic:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.12'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0
      - uses: fredrikekre/runic-action@26bdc21c15f81fbd4c7605a5f94fb5a0060820a6 # v1.4.0
        with:
          # Keep in sync with the local `runic` CLI: Runic versions format differently, so a local
          # runic that is newer or older than this fails the check on files the hook reformatted.
          #   julia -e 'using Pkg; Pkg.Apps.add("Runic")'     # or Pkg.Apps.update("Runic")
          version: '1.11'
