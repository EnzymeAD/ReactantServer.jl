# Non-GPU test CI. A `changes` job computes, per suite, whether anything that suite depends on
# changed; each suite job runs only when its filter is true, so untouched packages don't burn
# runner time. `ci-ok` aggregates them into one status (mark it the required check in branch
# protection — a skipped suite counts as success, so required-check gating is not broken).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# actions: write is needed because the suite jobs call _test.yml, which runs julia-actions/cache
# (it prunes its own old caches). A called workflow cannot request more than the caller holds, so
# it is granted here at the top level; the `changes` job overrides with a narrower set below
permissions:
  contents: read
  actions: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # dorny/paths-filter reads changed files from the PR
    outputs:
      core: ${{ steps.filter.outputs.core }}
      client: ${{ steps.filter.outputs.client }}
      gateway: ${{ steps.filter.outputs.gateway }}
      server: ${{ steps.filter.outputs.server }}
      node: ${{ steps.filter.outputs.node }}
      export_lux: ${{ steps.filter.outputs.export_lux }}
      export_pytorch: ${{ steps.filter.outputs.export_pytorch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          # `common` (global files + Core) is folded into every suite, since Core is a dependency
          # of all of them and the global files affect everything. Each suite then adds its own
          # package dir and the vendored lib/* it depends on (submodule bumps show as a change to
          # the gitlink path `lib/X.jl`). Filters err toward over-inclusion so a real dependency
          # change can never produce a false green.
          filters: |
            common: &common
              - '.github/workflows/ci.yml'
              - '.github/workflows/_test.yml'
              - 'Project.toml'
              - '.gitmodules'
              - 'packages/ReactantServerCore/**'
            core:
              - *common
            client:
              - *common
              - 'packages/ReactantServerClient/**'
            gateway:
              - *common
              - 'packages/ReactantServerGateway/**'
              - 'lib/gRPCServer.jl'
              - 'lib/gRPCServer.jl/**'
            server:
              - *common
              - 'packages/ReactantServer/**'
              - 'lib/gRPCServer.jl'
              - 'lib/gRPCServer.jl/**'
            node:
              - *common
              - 'packages/ReactantServerNode/**'
            # The Lux round-trip runs whenever anything ReactantServerExport depends on changes.
            export_lux:
              - *common
              - 'packages/ReactantServerExport/**'
              - 'packages/ReactantServer/**'
              - 'lib/gRPCServer.jl'
              - 'lib/gRPCServer.jl/**'
            # The PyTorch round-trip provisions torch/jax/tensorflow via conda, so it runs only when
            # the PyTorch surface itself changes: the extension, its conda pins, its own test project,
            # or the shared test runner (which carries the torch-specific CPU-wheel and triton
            # handling). It deliberately omits both the `common` anchor and the workflow files, so
            # neither an unrelated Core change nor a CI edit pays the torch cost. To run it without a
            # matching change (for instance after editing the job itself), put the
            # `ci:export-pytorch` label on the PR.
            #
            # Known gap from this narrowness: PyTorchExportExt overrides fallback stubs defined in
            # ReactantServerExport/src, so a signature change there can break the extension without
            # this job running. The Lux arm does not load the extension, so nothing else catches it.
            export_pytorch:
              - 'packages/ReactantServerExport/ext/PyTorchExportExt.jl'
              - 'packages/ReactantServerExport/CondaPkg.toml'
              - 'packages/ReactantServerExport/test/pytorch/**'
              - 'packages/ReactantServerExport/test/runtests.jl'

  core:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    uses: ./.github/workflows/_test.yml
    with:
      cache-name: core
      command: "julia --color=yes --project=packages/ReactantServerCore -e 'using Pkg; Pkg.test(; julia_args=[\"--threads=auto,1\"])'"

  client:
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    uses: ./.github/workflows/_test.yml
    with:
      cache-name: client
      command: "julia --color=yes --project=packages/ReactantServerClient -e 'using Pkg; Pkg.test(; julia_args=[\"--threads=auto,1\"])'"

  gateway:
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' }}
    uses: ./.github/workflows/_test.yml
    with:
      cache-name: gateway
      command: "julia --color=yes --project=packages/ReactantServerGateway -e 'using Pkg; Pkg.test(; julia_args=[\"--threads=auto,1\"])'"

  server:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    uses: ./.github/workflows/_test.yml
    with:
      cache-name: server
      command: "julia --color=yes --project=packages/ReactantServer -e 'using Pkg; Pkg.test(; julia_args=[\"--threads=auto,1\"])'"

  node:
    needs: changes
    if: ${{ needs.changes.outputs.node == 'true' }}
    uses: ./.github/workflows/_test.yml
    with:
      cache-name: node
      command: "julia --color=yes --project=packages/ReactantServerNode -e 'using Pkg; Pkg.test(; julia_args=[\"--threads=auto,1\"])'"

  # Lux-only round-trip. Two things keep the conda environment out of this job, and both are needed:
  # test/Project.toml omits PythonCall and CondaPkg, so `Pkg.instantiate` has no PythonCall-triggered
  # extension to precompile (precompiling one loads PythonCall, which provisions ~7.4 GB of
  # torch/jax/tensorflow before runtests.jl ever runs), and REACTANTSERVER_SKIP_PYTORCH=true then
  # keeps runtests.jl from trying to load PythonCall at all. The standalone test/ project is not a
  # Pkg.test target, so it is instantiated explicitly before the runner script.
  export-lux:
    needs: changes
    if: ${{ needs.changes.outputs.export_lux == 'true' }}
    uses: ./.github/workflows/_test.yml
    with:
      cache-name: export-lux
      command: "julia --color=yes --project=packages/ReactantServerExport/test -e 'using Pkg; Pkg.instantiate()' && REACTANTSERVER_SKIP_PYTORCH=true julia --color=yes --project=packages/ReactantServerExport/test packages/ReactantServerExport/test/runtests.jl"

  # Full round-trip including the PyTorch export path. Standalone (not the reusable workflow) so it
  # can run the torch path with the full conda provisioning, via test/pytorch/Project.toml (the same
  # environment as the Lux arm plus PythonCall and CondaPkg). The CondaPkg Python environment
  # (torch/jax/tensorflow) is deliberately NOT cached: CondaPkg's pixi package cache lives in the
  # depot's scratchspaces and measures ~7.4 GB on its own, over GitHub's 10 GB per-repo and
  # per-cache-entry ceiling, so caching it would evict every other cache in the repo. Reactant's
  # precompile output is still cached; only the Python side is excluded.
  export-pytorch:
    needs: changes
    # The label is the manual escape hatch for the narrow filter above; it is the only way to run
    # this job on a PR that does not touch the PyTorch surface.
    if: ${{ needs.changes.outputs.export_pytorch == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:export-pytorch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write   # julia-actions/cache prunes its old caches
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.12'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0
        with:
          cache-scratchspaces: false   # see the note above: this is where the pixi cache lives
      - name: Run PyTorch export round-trip
        run: |
          julia --color=yes --project=packages/ReactantServerExport/test/pytorch -e 'using Pkg; Pkg.instantiate()'
          julia --color=yes --project=packages/ReactantServerExport/test/pytorch packages/ReactantServerExport/test/runtests.jl

  ci-ok:
    needs: [core, client, gateway, server, node, export-lux, export-pytorch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no suite failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "suite results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A test suite failed or was cancelled."
              exit 1
            fi
          done
          echo "All required suites passed or were skipped."
