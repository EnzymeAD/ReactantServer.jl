# Reusable workflow: run one CPU test suite. Called per-package by ci.yml so the pinned action
# SHAs, checkout, and depot caching live in one place. Not triggered on its own.
name: test suite

on:
  workflow_call:
    inputs:
      command:
        description: The full julia test command to run.
        required: true
        type: string
      cache-name:
        description: >-
          Unique name for this suite's Julia depot cache. Required because inside a reusable
          workflow github.job is always 'run', so without an explicit name every suite would
          share one cache and clobber each other's precompiled Reactant/Lux depot every run.
        required: true
        type: string
      julia-version:
        description: Julia version to test on.
        required: false
        type: string
        default: '1.12'
      os:
        description: Runner operating system for the suite.
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: Job timeout. The default covers a first run's Reactant download and compile.
        required: false
        type: number
        default: 60
      coverage-directories:
        description: >-
          Comma-separated source directories to collect coverage for (for example
          packages/ReactantServerCore/src). Empty means no coverage. The command must run the
          tests with coverage on, e.g. Pkg.test(; coverage = true), for there to be any.
        required: false
        type: string
        default: ''
      coverage-flag:
        description: >-
          Codecov flag to upload the coverage under (declared in codecov.yml). Defaults to the
          cache-name; set it when one suite runs as several jobs (an OS matrix) that should report
          as one.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write   # julia-actions/cache prunes its old caches

jobs:
  run:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ inputs.julia-version }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-name: julia-${{ inputs.cache-name }}
      # No REACTANT_GPU env => Reactant selects the CPU artifact; threads come from the command.
      - name: Run tests
        # Leave automatic precompilation on. Pkg.test's parallel pass for the test flags
        # (check-bounds, coverage) is gated on it, and without that pass a cold cache compiles every
        # dependency serially at load time, nested inside other packages' precompiles; ZMQ failed
        # that way under KaimonGate.
        run: ${{ inputs.command }}
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
        if: ${{ inputs.coverage-directories != '' }}
        with:
          directories: ${{ inputs.coverage-directories }}
      # The suite name (or coverage-flag) is the Codecov flag, so each suite's coverage is tracked on
      # its own and, with carryforward in codecov.yml, survives runs where its filter skipped it.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ inputs.coverage-directories != '' }}
        with:
          files: lcov.info
          flags: ${{ inputs.coverage-flag || inputs.cache-name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
