# Reusable workflow: run one CPU test suite. Called per-package by ci.yml so the pinned action
# SHAs, checkout, and depot caching live in one place. Not triggered on its own.
name: test suite

on:
  workflow_call:
    inputs:
      command:
        description: The full julia test command to run.
        required: true
        type: string
      cache-name:
        description: >-
          Unique name for this suite's Julia depot cache. Required because inside a reusable
          workflow github.job is always 'run', so without an explicit name every suite would
          share one cache and clobber each other's precompiled Reactant/Lux depot every run.
        required: true
        type: string
      julia-version:
        description: Julia version to test on.
        required: false
        type: string
        default: '1.12'
      os:
        description: Runner operating system for the suite.
        required: false
        type: string
        default: 'ubuntu-latest'
      coverage-directories:
        description: >-
          Comma-separated source directories to collect coverage for (for example
          packages/ReactantServerCore/src). Empty means no coverage. The command must run the
          tests with coverage on, e.g. Pkg.test(; coverage = true), for there to be any.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write   # julia-actions/cache prunes its old caches

jobs:
  run:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60   # generous for the first run's Reactant CPU artifact download + compile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ inputs.julia-version }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0
        with:
          cache-name: julia-${{ inputs.cache-name }}
      # No REACTANT_GPU env => Reactant selects the CPU artifact; threads come from the command.
      - name: Run tests
        run: ${{ inputs.command }}
        env:
          # Pkg.test runs the suite with different flags (check-bounds, coverage) than an ordinary
          # session, and on Julia 1.12 that recompiles every package anyway, so the automatic
          # precompile during resolution and instantiation would be paid twice for nothing.
          JULIA_PKG_PRECOMPILE_AUTO: '0'
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
        if: ${{ inputs.coverage-directories != '' }}
        with:
          directories: ${{ inputs.coverage-directories }}
      # The suite name is the Codecov flag, so each package's coverage is tracked on its own and,
      # with carryforward in codecov.yml, survives runs where its path filter skipped the suite.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ inputs.coverage-directories != '' }}
        with:
          files: lcov.info
          flags: ${{ inputs.cache-name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
